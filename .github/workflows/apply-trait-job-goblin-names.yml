name: Apply trait job bonuses and goblin names
on:
  push:
    branches:
      - codex/apply-trait-job-goblin-names
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vob-next
          fetch-depth: 0
      - name: Apply and test
        run: |
          echo '")' | base64 -d > /tmp/apply.py
          python /tmp/apply.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/domain/jobMath.js js/data/nameData.js js/data/dictionaryData.js
          git commit -m "feat: 排他特性の職業補正とゴブリン特殊名を追加"
          git push origin HEAD:codex/vob-next
