name: Package current v1.022 no-images

on:
  push:
    branches:
      - codex/vob-next
    paths:
      - .github/workflows/package-v1.022-current.yml

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Mugen zip
        run: python tools/package_mugen.py --no-images
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: village-of-bacchus-mugen-v1.022-no-images-current
          path: output/village-of-bacchus-mugen-v1.022-no-images.zip
          if-no-files-found: error
