name: Apply breakup reconcile history

on:
  push:
    branches:
      - codex/apply-breakup-reconcile-history

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vob-next
          fetch-depth: 0

      - name: Apply and verify
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python /tmp/apply.py
          node --check js/history.js
          grep -F 'と破局する。' js/history.js
          grep -F 'とヨリを戻し再び恋人になる。' js/history.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/history.js
          git commit -m "fix: 破局と復縁の個人史表記を改善"
          git push origin HEAD:codex/vob-next
