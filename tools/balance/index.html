<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOB バランス測定ランナー</title>
  <style>
    body { margin: 0; padding: 20px; color: #26211d; background: #f4efe5; font-family: sans-serif; }
    main { max-width: 1100px; margin: 0 auto; }
    fieldset { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 16px 0; padding: 16px; }
    label { display: grid; gap: 4px; }
    button, input, select { min-height: 36px; font: inherit; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    #progress { margin: 12px 0; font-weight: bold; }
    #summary { padding: 12px; background: #fff; border: 1px solid #b9ae9c; white-space: pre-wrap; }
    #frameHost { margin-top: 16px; }
    #frameHost iframe { width: 100%; height: 560px; border: 1px solid #796b59; background: #fff; }
    .frame-hidden iframe { position: fixed; left: -10000px; width: 1280px; height: 900px; }
  </style>
</head>
<body>
  <main>
    <h1>VOB バランス測定ランナー</h1>
    <p>同一生成元のゲーム画面を試行ごとに作り直し、シード付きで結果を収集します。</p>
    <fieldset>
      <label>
        シナリオ
        <select id="scenario"></select>
      </label>
      <label>
        開始シード
        <input id="startSeed" type="number" min="0" max="4294967295" step="1" value="1">
      </label>
      <label>
        試行数
        <input id="runCount" type="number" min="1" max="10000" step="1" value="10">
      </label>
      <label>
        <span>実行画面</span>
        <span><input id="showFrame" type="checkbox"> 表示する</span>
      </label>
    </fieldset>
    <div class="actions">
      <button id="startButton" type="button">測定開始</button>
      <button id="cancelButton" type="button" disabled>中止</button>
      <button id="downloadButton" type="button" disabled>JSON保存</button>
    </div>
    <div id="progress">未実行</div>
    <pre id="summary">結果はまだありません。</pre>
    <div id="frameHost" class="frame-hidden" aria-label="測定中のゲーム画面"></div>
  </main>
  <script type="module" src="./runner.js?v=20260815-balance-47"></script>
</body>
</html>
